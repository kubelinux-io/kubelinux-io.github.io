# Project information
site_name: Kubelinux.io
site_url: https://kubelinux.io/
site_author: Kubelinux Team

# Repository
repo_name: kubelinux-io/kubelinux-io.github.io
repo_url: https://github.com/kubelinux-io/kubelinux-io.github.io

# Copyright
copyright: Copyright &copy; 2016 - 2024 Kubelinux Team

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil 
    view: material/eye
  features:
    - content.action.edit
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tracking

extra:
  version:
    provider: mike

edit_uri: edit/main/docs/

plugins:
  - blog
  - git-committers:
      repository: kubelinux-io/kubelinux-io.github.io
      branch: main
  - git-revision-date-localized:
        enable_creation_date: true
        fallback_to_build_date: true
  - search
  - tags